name: certificate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - run: python3 scripts/render_certificate.py --check
      - run: python3 earth/calculate.py --check
      - run: '! grep -R -n -E "\\bsorry\\b|\\badmit\\b" --include="*.lean" .'
      - run: lake build
      - run: lake env lean Main.lean
